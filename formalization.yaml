sources:
  - title: "On an Algebraic Generalization of the Quantum Mechanical Formalism"
    authors:
      - "Pascual Jordan"
      - "John von Neumann"
      - "Eugene Wigner"
    id: "Annals of Mathematics 35 (1934), no. 1, 29-64"
    # Crossref-verified 2026-10-22: DOI 10.2307/1968117.
    type: "article"
    location: "https://doi.org/10.2307/1968117"
    relationship: "background"
    note: >-
      PRIOR ART, disclosed and distinguished. The Hermitian matrix
      algebras as Jordan algebras, with Herm_2 the spin factor whose
      determinant form is Minkowski. The Lorentz form of this entry is
      tr(X X^T) (sigma_y timelike), not the determinant, and its boost is
      i composed with Galois conjugation; nothing from the determinant
      structure is formalized or claimed.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Spinors and space-time, Vol. 1: Two-spinor calculus and relativistic fields"
    authors:
      - "Roger Penrose"
      - "Wolfgang Rindler"
    id: "Cambridge Monographs on Mathematical Physics, Cambridge University Press, 1984, Section 1.2"
    # DOI of the book: 10.1017/CBO9780511564048 (cited through secondary confirmation; not opened).
    type: "book"
    location: "https://doi.org/10.1017/CBO9780511564048"
    relationship: "background"
    note: >-
      PRIOR ART, disclosed and distinguished. The classical
      Herm_2(C) = R^{3,1} dictionary with the spinor action X -> A X A^*
      of SL(2,C), and the self-dual/anti-self-dual splitting under which
      the Hodge dual of a boost is a rotation. Not this entry's structure
      (see the Jordan-von Neumann-Wigner note); statement (13) says which
      boost and which rotation in a number field's place coordinates.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "The octonions"
    authors:
      - "John C. Baez"
    id: "Bulletin of the American Mathematical Society 39 (2002), 145-205; arXiv:math/0105155, Section 3.3"
    type: "article"
    location: "https://arxiv.org/abs/math/0105155"
    relationship: "background"
    note: >-
      Section 3.3 reads Herm_2(K) as a spin factor with the determinant
      as the Minkowski form. Background for the prior-art guard only.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "The discriminant matrices of an algebraic number field"
    authors:
      - "Olga Taussky"
    id: "Journal of the London Mathematical Society s1-43 (1968), no. 1, 152-154"
    # Crossref-verified 2026-10-22: DOI 10.1112/jlms/s1-43.1.152.
    type: "article"
    location: "https://doi.org/10.1112/jlms/s1-43.1.152"
    relationship: "background"
    note: >-
      The type (r1 + r2, r2) of the trace form of a number field
      (Hermite-Sylvester; number-field form credited to Taussky). Here
      the place-coordinate form sum x_i^2 + sum 2 Re(z_j^2) of that type
