    license: "unknown"
    author_endorsement: "n/a"
  - title: "Barbero's Hamiltonian derived from a generalized Hilbert-Palatini action"
    authors:
      - "Sören Holst"
    id: "Physical Review D 53 (1996), 5966-5969"
    # Crossref-verified 2026-10-22: DOI 10.1103/PhysRevD.53.5966.
