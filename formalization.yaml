      formalization over Algebra.traceForm is the author's registered
      entry PALOMAR-2026-10-21-000012, not re-compared.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Galois Properties of the Eigenproblem of the Hexagonal Magnetic Heisenberg Ring"
    authors:
      - "Grzegorz Banaszak"
      - "Stefan Barańczuk"
      - "Tadeusz Lulek"
      - "Jan Milewski"
      - "Ryszard Stagraczyński"
    id: "Acta Physica Polonica A 121 (2012), 1111-1114"
    # Crossref-verified 2026-10-22: DOI 10.12693/APhysPolA.121.1111. Text not read; cited for the
