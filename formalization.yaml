version: "v0.4"
# Review status: self-assessed by the author (see the review block below).

project:
  name: "The arithmetic Lorentz group of a number field with one complex place, and its bridge to the local Hodge register"
  description: >-
    Kernel-checked proofs, in Lean 4 + Mathlib, of sixteen statements
    about the place space V = R^{r1} x C of a number field with r1 real
    places and one complex place, carrying the trace form
    T = sum x_i y_i + 2 Re(z w) (the field's Tr_{K/Q}(xy) at the mixed
    embedding, of type (r1 + 1, 1)) and the positive-definite Born form
    B = sum x_i y_i + 2 Re(z conj w); for r1 = 2, V is Herm_2(C) with
    T = Re tr(X Y^T) and B = Re tr(X Y). (1) tr(X X^T) on Herm_n(C) has
    exactly one negative direction iff n = 2; (2) then sigPos = 3 and
    dim_R Herm_n(C) = 4. (3) Every place-preserving infinitesimal isometry
    of T is a real multiple of boostGen: (x, z) -> (0, i conj z) (the
    real places admit none); (4) every place-preserving isometry of T is
    a sign on each real place and, on the complex place, +/- boost(beta)
    or +/- boost(beta) o conj, boost(beta): z -> cosh(beta) z +
    i sinh(beta) conj z, i.e. the group {+/-1}^{r1} x O(1,1); (5) every
    boost is a T-isometry; (6) no boost with beta != 0 is a Born
    isometry; (7) Galois conjugation c conjugates boost(beta) to
    boost(-beta); (8) the polar phase z -> e^{i theta} z is a T-isometry
    iff sin theta = 0. The second half is stated on the data of the
    author's registered entry PALOMAR-2026-09-30-000024 (the metric
    eta = diag(1,1,1,-1,1,-1), the generators L_ab = eta_b E_ab -
    eta_a E_ba, the local Hodge star on the 0123 plane, the chirality
    projectors P+- and the divide D = rho P+ + Q P-), transcribed on the
    0123 plane as explicit real matrices and re-proved, nothing
    imported: (9) a Lorentz map Lambda (Lambda^T eta4 Lambda = eta4)
    with Lambda c Lambda^{-1} = P, P = diag(1,1,1,-1) the register's
    time reflection (the same matrix as Galois conjugation in place
    coordinates), is diag(R, s) with R^T R = 1, s = +/-1; (10) for
    Lambda in O(3,1), Lambda P Lambda^{-1} = P iff Lambda Lambda^T = 1;
    (11) diag(R,s) K diag(R^T,s) = -s (n0 L03 + n1 L13 + n2 L23) with
    n = R e2, K the generator of i o c; (12) diag(R,s) J diag(R^T,s) is
    in no so(3,1), J the phase generator; (13) the Hodge star sends
    diag(R,s) K diag(R^T,s) to s (n0 L12 - n1 L02 + n2 L01), so H(K) =
    L01, the rotation of the two real places; (14) D(iConj) =
    (rho+Q)/2 iConj - i (rho-Q)/2 L01; (15) D . flip(D) = rho Q; (16) if
    1 + H/gamma is proportional to D with rho != Q, rho + Q != 0, then
    gamma is purely imaginary (gamma = i (rho+Q)/(rho-Q)). Sixteen
    compared theorems. Classical and not this structure: Herm_2(C) =
    R^{3,1} through the determinant with the spinor action X -> A X A^*
    (Jordan-von Neumann-Wigner 1934; Penrose-Rindler 1984) - here the
    form is tr(X X^T) with sigma_y timelike and the boost is i composed
    with Galois conjugation, not a conjugation; that the Hodge dual of a
    boost generator is a rotation generator is textbook; (1)-(2) are
    Sylvester's law on the place shape (n, n(n-1)/2), and the type
    (r1 + r2, r2) of a number field's trace form is Hermite-Sylvester
    (Taussky 1968), formalized in the author's PALOMAR-2026-10-21-000012,
    whose field Q(Q), Q^4 = Q + 1, places (2,1), is the instance of the
    shape r1 = 2 and is not restated here. No priority is claimed for
    any ingredient; the contribution is the kernel-checked classification
    (3)-(4) in a number field's place coordinates and the bridge (9)-(16)
    on the register's own matrices.
    Application (cited, not a claim of the entry): in the author's Pisot
    Dimensional Theory Q(Q) is the arithmetic of four-dimensional
    spacetime, its place space is Herm_2(C) and its trace form is the
    Minkowski form of signature (3,1). Read through the theory, (3)-(8)
    say that the only Lorentz symmetry the arithmetic itself carries is
    the boost i o c of the complex place, generated by Galois
    conjugation, with Galois conjugation as time reversal, and that the
    phase, the symmetry of the Born form, is not a Lorentz symmetry;
    (9)-(10) say that a Lorentz map carrying Galois conjugation to the
    register's time reflection fixes the time axis up to sign and is
    otherwise a rotation of the three remaining place directions;
    (11)-(13) place the arithmetic boost in the register's boost span and
    send it, by the Hodge star, to the rotation of the two real places;
    (14)-(16) say that the register's Hodge divide rho P+ + Q P- mixes
    that boost with that rotation unless rho = Q, is a unit of weight
    rho Q against its flip, and has a purely imaginary Holst
    coefficient, so no real Barbero-Immirzi parameter can be read off it.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

