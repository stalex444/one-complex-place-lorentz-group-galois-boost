status:
  scope: >-
    Formalized, 16 compared theorems, hypotheses inline, in namespace
    ArithmeticLorentz: sigNeg_transposeForm_eq_one_iff,
    hermitian_exclusion (Herm_n(C), Mathlib's sigPos/sigNeg of the
    quadratic form X -> Re tr(X X^T)); infIsometry_classification,
    placePreserving_isometry_classification, traceB_boost,
    galoisConj_boost_galoisConj (every r1, on PlaceSpace r1 =
    (Fin r1 -> R) x (Fin 1 -> C)); hsForm_boost_ne, traceB_phaseV_iff
    (r1 = 2); time_canonical, conj_P_iff_orthogonal, boost_span,
    phase_not_mem_so31, hodge_exchange (explicit real 4 x 4 matrices);
    divide_iConj, divide_mul_flip, holst_gamma_not_real (explicit
    complex 6 x 6 matrices). Each compared theorem is one declaration;
    Solution.lean proves each by exact of one theorem of the proof
    modules. NOT formalized (cited or not claimed): that (x, z) ->
    (0, i z) is the derivative of the polar phase at theta = 0; the
    converse of (4) beyond the boosts and Galois conjugation (the module
    proves boost_placePreserving, boost_isIsometry,
    galoisConj_placePreserving, galoisConj_isIsometry); that the
    register's time reflection is Galois conjugation (a hypothesis of
    (9)); the register's sl(15) generation; everything in the
    application paragraph (spacetime, time reversal, the Barbero-Immirzi
    parameter).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  # Every compared theorem's #print axioms output is exactly
  # [propext, Classical.choice, Quot.sound]; re-elaborated 2026-10-22
  # for all 16 names through Solution (BUILD.txt).

