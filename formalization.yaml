fidelity:
  divergences: >-
    (i) "Signature" means the pair (sigPos, sigNeg) of Mathlib's
    basis-free inertia indices of the quadratic form X -> Re tr(X X^T)
    on the real subspace herm n of Hermitian matrices. (ii) The place
    space is the concrete type (Fin r1 -> R) x (Fin 1 -> C); the forms
    traceB, bornB are functions to R, not bundled bilinear forms;
    place-preservation is the explicit block-diagonality predicate
    PlacePreserving. (iii) Statement (4) produces the rapidity beta by
    Real.arsinh and states the classification direction only; O(1,1) is
    not Mathlib's orthogonal group but the explicit family of maps in the
    statement. (iv) Statement (6) is stated on Herm_2(C) through the
    place isomorphism placeEquiv (hsForm 2 of the boosted and unboosted
    place matrices); the proof module also proves the place-coordinate
    deviation bornB_boost_self. (v) Statement (8) is the place-coordinate
    form of the polar phase, phaseV theta : (x, z) -> (x, e^{i theta} z);
    on Herm_2(C) this is Ad diag(1, e^{i theta}), which is not restated.
    (vi) In (9)-(16) so(3,1) is so31, the R-span of the six transcribed
    generators (equal to the eta4-skew matrices by mem_so31_iff in the
    module); O(3,1) is the hypothesis Lambda^T eta4 Lambda = eta4;
    Lambda^{-1} is Mathlib's Matrix.inv; the Hodge star is hodgeOp =
    fromCoords o Hmat o coords4 on 4 x 4 matrices and the 6 x 6 table HC
    on local coordinates; the divide and its flip are explicit complex
    6 x 6 matrices; the Holst condition in (16) is the existence of a
    complex scalar lam with 1 + gamma^{-1} HC = lam . divide rho Q.
    (vii) The compared statements use definitions of this entry, stated
    in Challenge.lean itself between the lines -- BEGIN SHARED
    DEFINITIONS and -- END SHARED DEFINITIONS, byte for byte the block
    of ArithmeticLorentz/Defs.lean on which the proof modules are built;
    Challenge.lean imports Mathlib only and says so in its opening
    docstring.

review:
  status: "self-assessed"
  reviewers:
    - "Stephanie Alexander"
  notes: >-
    The kernel and the axiom audit are the acceptance criteria. The
    package was re-verified independently of the proving sessions (build
    green, axioms re-elaborated for all 16 compared declarations through
    Solution, the Challenge and Solution statements generated from one
    text and the shared block checked byte-identical by
    tools/check_shared_block.py, the compared set and its count checked
